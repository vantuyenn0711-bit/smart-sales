{% if page_obj.paginator.count %}<div class="pagination"><p>Hiển thị <strong>{{ page_obj.start_index }}–{{ page_obj.end_index }}</strong> trong {{ page_obj.paginator.count }} kết quả</p><nav aria-label="Phân trang">{% if page_obj.has_previous %}<a class="page-button" href="{% querystring page=page_obj.previous_page_number %}" aria-label="Trang trước">←</a>{% endif %}<span class="page-button current">{{ page_obj.number }}</span><span class="text-muted">/ {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="page-button" href="{% querystring page=page_obj.next_page_number %}" aria-label="Trang sau">→</a>{% endif %}</nav></div>{% endif %}
