<div class="form-field product-field"><label for="{{ item.product.id_for_label }}">Sản phẩm</label>{{ item.product }}{% for error in item.product.errors %}<p class="field-error">{{ error }}</p>{% endfor %}<span class="line-product-info field-help"></span></div><div class="form-field quantity-field"><label for="{{ item.quantity.id_for_label }}">Số lượng</label>{{ item.quantity }}{% for error in item.quantity.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div><div class="delete-field" hidden>{{ item.DELETE }}</div><button type="button" class="icon-button remove-item" data-remove-item aria-label="Xóa dòng sản phẩm">×</button>
