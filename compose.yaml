name: smart-sales
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: smart_sales
      POSTGRES_USER: smart_sales
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_sales -d smart_sales"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgresql://smart_sales:${POSTGRES_PASSWORD}@db:5432/smart_sales
    volumes:
      - product_media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", ".venv/bin/python manage.py migrate --noinput && exec .venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile - --error-logfile -"]
volumes:
  postgres_data:
  product_media:
